# Omni-MRL / Omni-Lindy Scheduler HTTP Extender Deployment 및 ClusterIP Service 매니페스트 (v11.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-lindy-extender
  namespace: kube-system
  labels:
    app: omni-lindy-extender
    version: v11.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-lindy-extender
  template:
    metadata:
      labels:
        app: omni-lindy-extender
        version: v11.0
    spec:
      containers:
        - name: extender
          image: omni-lindy-extender:v11.0
          imagePullPolicy: IfNotPresent
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8888"
            - "--nodes-per-rack"
            - "8"
            - "--engine"
            - "omni_mrl"
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: omni-lindy-extender
  namespace: kube-system
  labels:
    app: omni-lindy-extender
spec:
  type: ClusterIP
  selector:
    app: omni-lindy-extender
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
