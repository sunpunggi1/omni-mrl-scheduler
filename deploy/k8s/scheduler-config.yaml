# Kubernetes kube-scheduler용 Omni-MRL / Omni-Lindy HTTP Extender 설정 파일 (v11.0)
# 참고: weight는 kube-scheduler가 Extender의 [0, 10] 점수를 0..100으로 환산한 뒤 적용됩니다.
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
leaderElection:
  leaderElect: true
clientConnection:
  kubeconfig: /etc/kubernetes/scheduler.conf
profiles:
  - schedulerName: omni-lindy-scheduler
extenders:
  - urlPrefix: "http://omni-lindy-extender.kube-system.svc.cluster.local:8888"
    filterVerb: "filter"
    prioritizeVerb: "prioritize"
    weight: 5
    enableHTTPS: false
    nodeCacheCapable: false
    ignorable: true
    httpTimeout: 5s
    managedResources:
      # 참고: 표준 kube-scheduler는 Pod spec.resources 내 확장 자원만 Extender 호출 조건(IsInterested)으로 봅니다.
      # fractional GPU(omni-lindy.io/gpu-milli)만 사용하는 Pod를 라우팅하려면 nvidia.com/gpu: 1 또는
      # 별도 커스텀 리소스를 함께 요청하거나 nodeCacheCapable/프로파일을 워크로드에 맞게 설정해야 합니다.
      - name: "nvidia.com/gpu"
        ignoredByScheduler: false
